<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L4D2 Mod Manager · 可交互演示</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">

  <!-- ==================================================== 01 TitleBar -->
  <header class="topbar pywebview-drag-region">
    <div class="title-left">
      <img src="assets/app-icon.png" alt="">
      <span class="brand-name">L4D2 // ARMORY</span>
    </div>

    <label class="top-search">
      <svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
      <input id="search" type="search" placeholder="搜索模组、别名、标签、文件" aria-label="搜索模组" autocomplete="off">
      <span class="kbd">Ctrl K</span>
    </label>

    <div class="ws-tabs" role="tablist" aria-label="工作区">
      <button class="ws-tab active" type="button" role="tab" aria-selected="true" data-view="library">
        <svg class="i" aria-hidden="true"><use href="#i-grid"></use></svg><span>浏览</span>
      </button>
      <button class="ws-tab" type="button" role="tab" aria-selected="false" data-view="import">
        <svg class="i" aria-hidden="true"><use href="#i-archive"></use></svg><span>导入压缩包</span>
      </button>
      <button class="ws-tab" type="button" role="tab" aria-selected="false" data-view="download">
        <svg class="i" aria-hidden="true"><use href="#i-download"></use></svg><span>链接下载</span>
      </button>
      <button class="ws-tab" type="button" role="tab" aria-selected="false" data-view="settings">
        <svg class="i" aria-hidden="true"><use href="#i-settings"></use></svg><span>设置</span>
      </button>
    </div>

    <span class="game-status" id="gameStatus" title="游戏未运行"><i class="dot"></i></span>
    <button class="launch-button" id="launchBtn" type="button">
      <svg class="i" aria-hidden="true"><use href="#i-play"></use></svg>启动
    </button>

    <div class="window-controls" aria-label="窗口控制">
      <button class="caption" type="button" title="最小化" aria-label="最小化" data-caption="min">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"></path></svg>
      </button>
      <button class="caption" type="button" title="最大化" aria-label="最大化" data-caption="max">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx=".8"></rect></svg>
      </button>
      <button class="caption close" type="button" title="关闭" aria-label="关闭" data-caption="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"></path></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <!-- ================================================== 02 Rail -->
    <nav class="rail" aria-label="主导航">
      <div class="rail-nav" data-rail-group>
        <button class="rail-btn" type="button" data-rail="all"><svg class="i" aria-hidden="true"><use href="#i-grid"></use></svg><span>全部</span></button>
        <button class="rail-btn active" type="button" data-rail="survivor" aria-current="page"><svg class="i" aria-hidden="true"><use href="#i-users"></use></svg><span>角色</span></button>
        <button class="rail-btn" type="button" data-rail="special"><svg class="i" aria-hidden="true"><use href="#i-infected"></use></svg><span>特感</span></button>
        <button class="rail-btn" type="button" data-rail="weapon"><svg class="i" aria-hidden="true"><use href="#i-crosshair"></use></svg><span>武器</span></button>
        <button class="rail-btn" type="button" data-rail="map"><svg class="i" aria-hidden="true"><use href="#i-map"></use></svg><span>地图</span></button>
        <button class="rail-btn" type="button" data-rail="other"><svg class="i" aria-hidden="true"><use href="#i-box"></use></svg><span>其他</span></button>
      </div>
      <div class="rail-spacer"></div>
      <button class="rail-utility" id="tidyBtn" type="button">
        <svg class="i" aria-hidden="true"><use href="#i-shield"></use></svg><span>整理</span>
      </button>
      <button class="rail-btn rail-settings" type="button" data-view="settings">
        <svg class="i" aria-hidden="true"><use href="#i-settings"></use></svg><span>设置</span>
      </button>
    </nav>

    <!-- ================================================== 03 FilterPanel -->
    <aside class="filters" id="filters" aria-label="筛选"></aside>

    <!-- ================================================== main -->
    <main class="main">
      <div class="main-head">
        <div class="crumb" id="crumb"></div>
        <h1 class="page-title" id="pageTitle"></h1>
      </div>

      <!-- ------------------------------------------------ 04/05/06 浏览 -->
      <div class="views">
        <section class="view" data-panel="library">
          <div class="toolbar">
            <span class="toolbar-meta" id="countMeta"></span>
            <div class="view-toggle" aria-label="视图">
              <button class="active" type="button" data-layout="grid" title="网格视图" aria-label="网格视图"><svg class="i" aria-hidden="true"><use href="#i-grid"></use></svg></button>
              <button type="button" data-layout="list" title="列表视图" aria-label="列表视图"><svg class="i" aria-hidden="true"><use href="#i-list"></use></svg></button>
            </div>
            <span class="spacer"></span>
            <button class="mutex-btn on" type="button" id="mutexBtn" role="switch" aria-checked="true"
                    title="同组互斥：同一物品只允许启用一个模组">
              <svg class="i" aria-hidden="true"><use href="#i-lock"></use></svg><span>同组互斥</span>
            </button>
            <div class="sort-wrap" id="sortWrap">
              <button class="select-btn" type="button" id="sortBtn" aria-haspopup="listbox" aria-expanded="false">
                <span id="sortLabel">最近添加</span><svg class="i" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
              </button>
              <div class="sort-menu" id="sortMenu" role="listbox" hidden>
                <button type="button" role="option" data-sort="added"><svg class="i tick" aria-hidden="true"><use href="#i-check"></use></svg>最近添加</button>
                <button type="button" role="option" data-sort="name"><svg class="i tick" aria-hidden="true"><use href="#i-check"></use></svg>名称</button>
                <button type="button" role="option" data-sort="size"><svg class="i tick" aria-hidden="true"><use href="#i-check"></use></svg>文件大小</button>
                <button type="button" role="option" data-sort="enabled"><svg class="i tick" aria-hidden="true"><use href="#i-check"></use></svg>启用优先</button>
              </div>
            </div>
            <button class="icon-btn" type="button" id="refreshBtn" title="重新扫描" aria-label="重新扫描">
              <svg class="i" aria-hidden="true"><use href="#i-refresh"></use></svg>
            </button>
          </div>
          <div class="grid-wrap scroll" id="gridWrap">
            <div class="grid" id="grid"></div>

            <div class="onboard" id="onboard" hidden>
              <div class="onboard-inner">
                <h2 class="onboard-title">还没有模组</h2>
                <button class="onboard-action" type="button" id="onboardStart">开始整理</button>
              </div>
            </div>
          </div>
        </section>

        <!-- ---------------------------------------------- 导入 -->
        <section class="view" data-panel="import" hidden>
          <div class="view-body">
            <button class="drop-zone" id="dropZone" type="button">
              <span class="drop-icon"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg></span>
              <span class="drop-title">选择压缩包</span>
              <span class="drop-hint">ZIP / 7z / RAR</span>
            </button>

            <div id="importProgress" hidden>
              <div class="task-panel" style="margin-top:12px">
                <div class="task-head"><span id="importProgressTitle">正在解析</span><span class="mono" id="importProgressMeta"></span></div>
                <div class="panel-body" style="padding:12px">
                  <div class="inline-progress">
                    <span class="inline-label" id="importProgressLabel">准备中</span>
                    <span class="inline-bar"><i id="importProgressBar"></i></span>
                  </div>
                </div>
              </div>
            </div>

            <div class="task-panel" id="importPanel" hidden>
              <div class="task-head">
                <span id="importPanelTitle">可加入的模组</span>
                <span class="task-actions">
                  <button type="button" data-import-all="1">全选</button>
                  <button type="button" data-import-all="0">清空</button>
                </span>
              </div>
              <div class="task-list" id="importList"></div>
            </div>

            <div class="task-actions-bar" id="importActions" hidden>
              <button class="btn primary" id="importCommit" type="button">加入模组库</button>
            </div>
          </div>
        </section>

        <!-- ---------------------------------------------- 下载 -->
        <section class="view" data-panel="download" hidden>
          <div class="view-body">
            <div class="link-row">
              <svg class="i" aria-hidden="true"><use href="#i-link"></use></svg>
              <input id="linkInput" type="text" placeholder="创意工坊链接或物品 ID" aria-label="创意工坊链接" autocomplete="off">
              <button class="btn" id="parseBtn" type="button">解析</button>
            </div>

            <div class="task-panel" id="downloadPanel" hidden>
              <div class="task-head"><span id="downloadPanelTitle">已解析</span><span class="mono" id="downloadPanelMeta"></span></div>
              <div class="task-list" id="downloadList"></div>
            </div>

            <div class="task-actions-bar" id="downloadActions" hidden>
              <button class="btn primary" id="downloadStart" type="button">开始下载</button>
            </div>

            <div id="downloadRunning" hidden>
              <div class="task-panel" style="margin-top:12px">
                <div class="task-head"><span id="dlRunTitle">正在下载</span><span class="mono" id="dlRunMeta"></span></div>
                <div class="panel-body" style="padding:12px">
                  <div class="inline-progress">
                    <span class="inline-label" id="dlRunLabel">—</span>
                    <span class="inline-bar"><i id="dlRunBar"></i></span>
                  </div>
                  <div class="log-box" id="dlLog"></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ---------------------------------------------- 设置 -->
        <section class="view" data-panel="settings" hidden>
          <div class="settings" id="settings"></div>
        </section>
      </div>
    </main>

    <!-- ================================================== 07 Inspector -->
    <aside class="inspector" id="inspector" aria-label="模组详情"></aside>
  </div>

  <!-- ==================================================== 08 StatusBar -->
  <footer class="statusbar">
    <span class="status-idle" id="statusIdle"><span class="dot"></span>就绪</span>
    <span class="status-activity" id="statusActivity" hidden>
      <span class="dot"></span>
      <span id="statusActivityLabel">扫描中</span>
      <span class="activity-bar"><i id="statusActivityBar"></i></span>
    </span>
    <span class="status-error" id="statusError" hidden>
      <svg class="i" aria-hidden="true"><use href="#i-alert"></use></svg>
      <span id="statusErrorText"></span>
      <button type="button" id="statusErrorAction">去设置</button>
    </span>
    <span class="spacer"></span>
    <button class="status-path" id="statusPath" type="button" title="打开 addons 目录"></button>
    <span class="status-version" id="statusVersion"></span>
  </footer>
</div>

<div id="modal-root">
  <div class="scrim"></div>
  <div class="modal-wrap"><div id="modal-host"></div></div>
</div>
<div id="toast" role="status"></div>

  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-width="2.4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></symbol>

  <symbol id="i-map" viewBox="0 0 24 24"><path d="m3.5 6.2 5-2.7 7 2.7 5-2.7v14.3l-5 2.7-7-2.7-5 2.7Z"/><path d="M8.5 3.5v14.3M15.5 6.2v14.3"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 8 4.3v9.4L12 21l-8-4.3V7.3Z"/><path d="m4.4 7.5 7.6 4.2 7.6-4.2M12 11.7V21"/></symbol>

  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.7v12.6c0 .8.9 1.3 1.6.9l10.1-6.3c.6-.4.6-1.4 0-1.8L9.6 4.8c-.7-.4-1.6.1-1.6.9Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="4" rx="1"/><path d="M5 8v12h14V8M9.5 12h5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M4 19.5h16"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.4 1.4"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.4-1.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-caret" viewBox="0 0 12 12"><path d="M2.2 4.2 6 8l3.8-3.8z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6.5 9 5.5 5.5L17.5 9"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.6"/><path d="M8.4 11V7.8a3.6 3.6 0 0 1 7.2 0V11"/><circle cx="12" cy="15.2" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-lock-open" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.6"/><path d="M8.4 11V7.8a3.6 3.6 0 0 1 6.9-1.4"/><circle cx="12" cy="15.2" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9.5 6.5 5.5 5.5-5.5 5.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.8 12.3 4.6 4.6 9.8-9.8"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.8 21 20H3Z"/><path d="M12 9v4.8M12 17.2h.01" stroke-width="2"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.4a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 3.8h5M6.5 7l.8 13h9.4l.8-13M10 11v5M14 11v5"/></symbol>

  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.1 6.4"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-check-square" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="m7.5 12.2 3.1 3.1 6-6"/></symbol>
</svg>
<script src="bridge.js"></script>
<script src="events.js"></script>
<script src="app.js"></script>
</body>
</html>
