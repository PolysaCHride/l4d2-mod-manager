<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bridge 验证</title>
<style>
  body { background:#0f1114; color:#e8ebe5; font:14px/1.6 "Microsoft YaHei UI"; padding:40px; }
  h1 { font-size:18px; margin:0 0 20px; }
  li { margin:6px 0; font-family:"Cascadia Mono",monospace; font-size:12px; }
  .ok { color:#9bb34e; } .bad { color:#ff6854; }
</style>
</head>
<body>
<h1>QWebChannel 双向通信验证</h1>
<ul id="out"><li>running…</li></ul>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
const log = (s, ok) => {
  const li = document.createElement('li');
  li.className = ok === true ? 'ok' : ok === false ? 'bad' : '';
  li.textContent = (ok === true ? '✓ ' : ok === false ? '✗ ' : '· ') + s;
  document.getElementById('out').appendChild(li);
};

new QWebChannel(qt.webChannelTransport, async (channel) => {
  const py = channel.objects.pybridge;
  window.__bridgeReady = true;
  log('channel opened');

  try {
    const t0 = performance.now();
    const pong = await py.ping();
    log(`ping -> ${pong} (${(performance.now() - t0).toFixed(1)}ms)`, pong === 'pong');
  } catch (e) { log('ping failed: ' + e, false); }

  try {
    const mods = JSON.parse(await py.getMods());
    log(`getMods -> ${mods.length} 条，首条「${mods[0].name}」`, mods.length === 3);
  } catch (e) { log('getMods failed: ' + e, false); }

  try {
    const before = JSON.parse(await py.getMods()).find(m => m.id === 'm1').enabled;
    const r = JSON.parse(await py.toggleMod('m1'));
    const after = JSON.parse(await py.getMods()).find(m => m.id === 'm1').enabled;
    log(`toggleMod -> enabled ${before} → ${after}`, before !== after);
  } catch (e) { log('toggleMod failed: ' + e, false); }

  try {
    await py.setAlias(JSON.stringify({ id: 'm1', alias: '测试别名' }));
    const m = JSON.parse(await py.getMods()).find(x => x.id === 'm1');
    log(`setAlias -> 「${m.alias}」`, m.alias === '测试别名');
  } catch (e) { log('setAlias failed: ' + e, false); }

  document.title = 'done';
});
</script>
</body>
</html>
